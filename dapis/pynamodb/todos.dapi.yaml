schema: https://opendapi.org/spec/0-0-1/dapi.json
urn: woven_demo.dapis.todos
owner_team_urn: placeholder text
description: A dataset containing information about to-do items, including their status,
  creation and update timestamps, and text description.
type: entity
primary_key:
- todo_id
fields:
- name: assignee_email
  data_type: string
  is_nullable: false
  is_pii: true
  access: private
  description: The email of the person assigned to the to-do item.
- name: createdAt
  data_type: string
  is_nullable: false
  is_pii: false
  access: private
  description: Timestamp indicating when the to-do item was created.
- name: description
  data_type: string
  is_nullable: false
  is_pii: false
  access: private
  description: A detailed text description of the to-do item.
- name: is_checked
  data_type: boolean
  is_nullable: false
  is_pii: false
  access: private
  description: Boolean value indicating whether the to-do item is checked off as completed.
- name: is_okr
  data_type: boolean
  is_nullable: false
  is_pii: false
  access: private
  description: Boolean value indicating if the to-do item is part of an Objective
    and Key Results (OKR) framework.
- name: todo_id
  data_type: string
  is_nullable: false
  is_pii: true
  access: private
  description: Unique identifier for the to-do item.
- name: updatedAt
  data_type: string
  is_nullable: false
  is_pii: false
  access: private
  description: Timestamp indicating the last update time of the to-do item.
datastores:
  sources:
  - urn: woven_demo.datastores.dynamodb
    data:
      identifier: todos
      namespace: ''
  sinks:
  - urn: woven_demo.datastores.snowflake
    data:
      identifier: PRODUCTION_TODOS
      namespace: TODOS.DYNAMODB
context:
  service: todos.todo_model
  integration: pynamodb
  rel_model_path: ../../todos/todo_model.py
